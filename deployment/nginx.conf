# 心语时光 - Nginx 配置文件
# 用于 Gunicorn 反向代理与静态文件服务

# 上游应用服务器（Gunicorn）
upstream heartmoments_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

# HTTP 服务器配置（如果使用 HTTPS，请取消注释下面的重定向部分）
server {
    listen 80;
    listen [::]:80;
    
    server_name your-domain.com www.your-domain.com;
    
    # 如果启用 HTTPS，取消注释以下行以重定向到 HTTPS
    # return 301 https://$server_name$request_uri;
    
    # 如果不使用 HTTPS，保留以下配置
    root /var/www/heartmoments;
    
    # 客户端最大上传大小（与应用配置一致）
    client_max_body_size 10M;
    
    # 日志文件
    access_log /var/log/nginx/heartmoments_access.log;
    error_log /var/log/nginx/heartmoments_error.log;
    
    # 静态文件服务（CSS、JS）
    location /static {
        alias /var/www/heartmoments/app/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 上传文件服务（照片等）
    location /uploads {
        alias /var/www/heartmoments/uploads;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # Favicon
    location /favicon.ico {
        alias /var/www/heartmoments/app/static/img/favicon.ico;
        access_log off;
        log_not_found off;
    }
    
    # 应用请求（反向代理到 Gunicorn）
    location / {
        proxy_pass http://heartmoments_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
}

