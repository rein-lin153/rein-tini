<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>音乐播放器 - 心语时光</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- 播放器样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/player.css') }}">
</head>
<body>
    <!-- 樱花飘落背景 -->
    <div id="sakura-container"></div>
    
    <!-- 播放器容器 -->
    <div class="player-container">
        <!-- 封面区域 -->
        <div class="player-cover-wrapper">
            <div class="player-cover" id="playerCover">
                <div class="player-cover-placeholder">
                    <i class="fas fa-music"></i>
                </div>
                <img id="coverImage" src="" alt="封面" style="display: none;">
            </div>
            <div class="player-cover-shadow"></div>
        </div>
        
        <!-- 歌曲信息 -->
        <div class="player-info">
            <h2 class="player-title" id="playerTitle">加载中...</h2>
            <p class="player-artist" id="playerArtist">--</p>
        </div>
        
        <!-- 进度条 -->
        <div class="player-progress-wrapper">
            <div class="player-time" id="currentTime">0:00</div>
            <div class="player-progress" id="progressBar">
                <div class="player-progress-bg"></div>
                <div class="player-progress-fill" id="progressFill"></div>
                <div class="player-progress-handle" id="progressHandle"></div>
            </div>
            <div class="player-time" id="duration">0:00</div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="player-controls">
            <button class="player-btn" id="shuffleBtn" title="随机播放">
                <i class="fas fa-random"></i>
            </button>
            <button class="player-btn" id="prevBtn" title="上一首">
                <i class="fas fa-step-backward"></i>
            </button>
            <button class="player-btn player-btn-primary" id="playPauseBtn" title="播放/暂停">
                <i class="fas fa-play"></i>
            </button>
            <button class="player-btn" id="nextBtn" title="下一首">
                <i class="fas fa-step-forward"></i>
            </button>
            <button class="player-btn" id="repeatBtn" title="循环播放">
                <i class="fas fa-redo"></i>
            </button>
        </div>
        
        <!-- 音量控制 -->
        <div class="player-volume-wrapper">
            <button class="player-btn-small" id="volumeBtn" title="音量">
                <i class="fas fa-volume-up"></i>
            </button>
            <div class="player-volume-slider" id="volumeSlider">
                <div class="player-volume-bg"></div>
                <div class="player-volume-fill" id="volumeFill"></div>
                <div class="player-volume-handle" id="volumeHandle"></div>
            </div>
        </div>
        
        <!-- 喜欢按钮 -->
        <div class="player-like-wrapper">
            <button class="player-like-btn" id="likeBtn" title="喜欢">
                <i class="far fa-heart"></i>
            </button>
        </div>
        
        <!-- 播放列表按钮 -->
        <div class="player-playlist-toggle">
            <button class="player-btn-small" id="playlistToggleBtn" title="播放列表">
                <i class="fas fa-list"></i>
                <span class="playlist-count" id="playlistCount">0</span>
            </button>
        </div>
        
        <!-- 播放列表 -->
        <div class="player-playlist" id="playlist">
            <div class="playlist-header">
                <h3>播放列表</h3>
                <button class="playlist-close" id="playlistCloseBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="playlist-items" id="playlistItems">
                <!-- 播放列表项将通过 JavaScript 动态生成 -->
            </div>
        </div>
    </div>
    
    <!-- 音频元素 -->
    <audio id="audioElement" preload="metadata"></audio>
    
    <!-- 播放器脚本 -->
    <script src="{{ url_for('static', filename='js/player.js') }}"></script>
</body>
</html>
