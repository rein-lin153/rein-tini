{% extends "base.html" %}

{% block title %}上传音乐 - {{ SITE_TITLE }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin_upload.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h2 class="mb-4">
                <i class="fas fa-music text-primary"></i> 上传音乐
            </h2>
            
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form id="musicUploadForm" enctype="multipart/form-data">
                        <!-- 音乐文件上传区域 -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">音乐文件 <span class="text-danger">*</span></label>
                            <div class="upload-area" id="musicUploadArea">
                                <i class="fas fa-cloud-upload-alt fa-3x text-primary mb-3"></i>
                                <p class="mb-2">点击选择或拖拽音乐文件到这里</p>
                                <p class="text-muted small">支持格式: MP3 (最大 25MB)</p>
                                <div class="file-input-wrapper mt-3">
                                    <button type="button" class="btn btn-primary">
                                        <i class="fas fa-file-audio"></i> 选择文件
                                    </button>
                                    <input type="file" 
                                           id="musicFile" 
                                           name="file" 
                                           class="file-input" 
                                           accept=".mp3"
                                           required>
                                </div>
                                <div id="musicFileName" class="mt-3 text-muted"></div>
                                <div class="progress-bar-container" id="musicProgressContainer">
                                    <div class="progress-bar" id="musicProgressBar"></div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 封面图片上传区域 -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">封面图片 <span class="text-muted">(可选)</span></label>
                            <div class="upload-area" id="coverUploadArea">
                                <i class="fas fa-image fa-3x text-primary mb-3"></i>
                                <p class="mb-2">点击选择或拖拽封面图片到这里</p>
                                <p class="text-muted small">支持格式: JPG, PNG, WEBP (最大 2MB)</p>
                                <div class="file-input-wrapper mt-3">
                                    <button type="button" class="btn btn-outline-primary">
                                        <i class="fas fa-image"></i> 选择封面
                                    </button>
                                    <input type="file" 
                                           id="coverFile" 
                                           name="cover" 
                                           class="file-input" 
                                           accept=".jpg,.jpeg,.png,.webp">
                                </div>
                                <div id="coverPreview" class="mt-3"></div>
                            </div>
                        </div>
                        
                        <!-- 歌曲信息（可选） -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">歌曲标题 <span class="text-muted">(可选)</span></label>
                                <input type="text" 
                                       class="form-control" 
                                       id="songTitle" 
                                       name="title" 
                                       placeholder="如果不填，将从文件名提取">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">艺术家 <span class="text-muted">(可选)</span></label>
                                <input type="text" 
                                       class="form-control" 
                                       id="songArtist" 
                                       name="artist" 
                                       placeholder="如果不填，将从文件名提取">
                            </div>
                        </div>
                        
                        <!-- 提交按钮 -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg" id="uploadBtn">
                                <i class="fas fa-upload"></i> 上传音乐
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- 上传结果提示 -->
            <div id="uploadResult" class="alert mt-4" style="display: none;"></div>
        </div>
    </div>
</div>

<!-- 隐藏的 token 字段 -->
<input type="hidden" id="adminToken" value="{{ admin_token }}">
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/music-upload-utils.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const musicUploadArea = document.getElementById('musicUploadArea');
        const coverUploadArea = document.getElementById('coverUploadArea');
        const musicFileInput = document.getElementById('musicFile');
        const coverFileInput = document.getElementById('coverFile');
        const musicFileName = document.getElementById('musicFileName');
        const coverPreview = document.getElementById('coverPreview');
        const uploadForm = document.getElementById('musicUploadForm');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadResult = document.getElementById('uploadResult');
        const musicProgressContainer = document.getElementById('musicProgressContainer');
        const musicProgressBar = document.getElementById('musicProgressBar');
        const adminToken = document.getElementById('adminToken').value;
        
        // 音乐文件选择
        musicFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // 验证文件类型
                if (!file.name.toLowerCase().endsWith('.mp3')) {
                    showResult('仅支持 MP3 格式', 'danger');
                    musicFileInput.value = '';
                    return;
                }
                
                musicFileName.innerHTML = `
                    <i class="fas fa-check-circle text-success"></i> 
                    <strong>${file.name}</strong> 
                    <span class="text-muted">(${(file.size / 1024 / 1024).toFixed(2)} MB)</span>
                `;
            }
        });
        
        // 封面文件选择
        coverFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    coverPreview.innerHTML = `
                        <img src="${e.target.result}" class="cover-preview" alt="封面预览">
                        <p class="text-muted small mt-2">${file.name}</p>
                    `;
                };
                reader.readAsDataURL(file);
            }
        });
        
        // 拖拽上传
        [musicUploadArea, coverUploadArea].forEach(area => {
            area.addEventListener('dragover', function(e) {
                e.preventDefault();
                area.classList.add('dragover');
            });
            
            area.addEventListener('dragleave', function(e) {
                e.preventDefault();
                area.classList.remove('dragover');
            });
            
            area.addEventListener('drop', function(e) {
                e.preventDefault();
                area.classList.remove('dragover');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    if (area === musicUploadArea) {
                        musicFileInput.files = files;
                        musicFileInput.dispatchEvent(new Event('change'));
                    } else {
                        coverFileInput.files = files;
                        coverFileInput.dispatchEvent(new Event('change'));
                    }
                }
            });
        });
        
        // 表单提交 - 使用公共上传函数
        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!musicFileInput.files[0]) {
                showResult('请选择音乐文件', 'danger');
                return;
            }
            
            const titleInput = document.getElementById('songTitle');
            const artistInput = document.getElementById('songArtist');
            
            // 使用公共上传函数
            uploadMusicFile({
                musicFile: musicFileInput.files[0],
                coverFile: coverFileInput.files[0] || null,
                title: titleInput ? titleInput.value.trim() : '',
                artist: artistInput ? artistInput.value.trim() : '',
                token: adminToken,
                onProgress: function (percent) {
                    musicProgressBar.style.width = percent + '%';
                },
                onStart: function () {
                    uploadBtn.disabled = true;
                    uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 上传中...';
                    musicProgressContainer.style.display = 'block';
                    musicProgressBar.style.width = '0%';
                },
                onFinish: function () {
                    uploadBtn.disabled = false;
                    uploadBtn.innerHTML = '<i class="fas fa-upload"></i> 上传音乐';
                    musicProgressContainer.style.display = 'none';
                    musicProgressBar.style.width = '0%';
                },
                onSuccess: function (data) {
                    showResult('上传成功！播放列表已更新。', 'success');
                    uploadForm.reset();
                    musicFileName.innerHTML = '';
                    coverPreview.innerHTML = '';
                    // 通知播放器刷新列表
                    notifyPlayerRefresh();
                },
                onError: function (error) {
                    showResult('上传失败：' + error, 'danger');
                }
            });
        });
        
        function showResult(message, type) {
            uploadResult.textContent = message;
            uploadResult.className = 'alert alert-' + type + ' mt-4';
            uploadResult.style.display = 'block';
            
            setTimeout(function() {
                uploadResult.style.display = 'none';
            }, 5000);
        }
        
        function notifyPlayerRefresh() {
            // 通过 localStorage 事件通知播放器刷新
            try {
                localStorage.setItem('musicPlaylistRefresh', Date.now().toString());
                localStorage.removeItem('musicPlaylistRefresh');
            } catch (e) {
                console.warn('localStorage 操作失败:', e);
            }
            
            // 通过 postMessage 通知内嵌播放器刷新
            try {
                if (window.postMessage) {
                    window.postMessage({
                        type: 'refreshPlaylist',
                        source: 'adminUpload',
                        timestamp: Date.now()
                    }, '*');
                }
            } catch (e) {
                console.debug('postMessage 失败:', e);
            }
            
            // 如果内嵌播放器存在，直接刷新
            if (window.embeddedMusicPlayer) {
                window.embeddedMusicPlayer.refreshPlaylist();
            }
        }
    });
</script>
{% endblock %}
