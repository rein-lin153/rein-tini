# HeartMoments Nginx 配置文件
# 项目路径: /home/opc/rein-tini
# 将此文件复制到: /etc/nginx/conf.d/heartmoments.conf

server {
    listen 80;
    server_name _;  # 替换为你的域名或IP，例如：example.com 或 217.142.232.70
    
    charset utf-8;
    # 允许上传的最大文件大小（50MB，支持音乐文件上传）
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_body_timeout 120s;
    
    # 访问日志
    access_log /var/log/nginx/heartmoments_access.log;
    error_log /var/log/nginx/heartmoments_error.log;
    
    # 静态文件（CSS, JS, 图片等）
    location /static/ {
        alias /home/opc/rein-tini/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }
    
    # 用户上传的文件
    location /uploads/ {
        alias /home/opc/rein-tini/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Favicon
    location = /favicon.ico {
        alias /home/opc/rein-tini/app/static/favicon.ico;
        log_not_found off;
        access_log off;
    }
    
    # Robots.txt
    location = /robots.txt {
        alias /home/opc/rein-tini/app/static/robots.txt;
        log_not_found off;
        access_log off;
    }
    
    # 代理到 Gunicorn（处理动态请求）
    location / {
        proxy_pass http://unix:/home/opc/rein-tini/heartmoments.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置（上传大文件需要更长的超时时间）
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # 禁用缓冲（大文件上传）
        proxy_buffering off;
        proxy_request_buffering off;
        
        # WebSocket 支持（可选，为未来扩展准备）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # 安全头（可选，增强安全性）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

